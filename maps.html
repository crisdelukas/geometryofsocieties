<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maps — geometry of societies</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<style>
  :root {
    --ink: #f2f2ee;
    --muted: #7c7c78;
    --paper: #000;
    --accent: #c8e054;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
  body { font-family: var(--mono); font-size: 11px; letter-spacing: .02em; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  em { font-style: italic; color: var(--muted); }

  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #boxes { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #boxes rect   { fill: none; stroke: var(--ink); stroke-width: .75; }
  #boxes line   { stroke: var(--ink); stroke-width: .5; }
  #boxes text   { font-family: var(--mono); font-size: 10.5px; fill: var(--ink); paint-order: stroke; stroke: #000; stroke-width: 3px; stroke-linejoin: round; }
  #boxes .dim   { fill: var(--muted); }
  #boxes .glyph { fill: var(--muted); font-size: 9px; }
  #boxes .hot rect { stroke: var(--accent); }

  .fade { position: fixed; left: 0; right: 0; height: 120px; pointer-events: none; }
  .fade.t { top: 0; background: linear-gradient(#000, transparent); }
  .fade.b { bottom: 0; background: linear-gradient(transparent, #000 75%); }
  .hud { position: fixed; left: 0; right: 0; padding: 16px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; pointer-events: none; }
  .hud a { pointer-events: auto; }
  .top { top: 0; }
  .bottom { bottom: 0; align-items: flex-end; }
  .cell { min-width: 120px; }
  .cell .k { color: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .cell .v { font-size: 13px; font-variant-numeric: tabular-nums; }
  .title { font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
  @media (max-width: 640px) { .cell { min-width: 0; } .cell.opt { display: none; } }
</style>
</head>
<body>

<div id="stage"></div>
<svg id="boxes"></svg>
<div class="fade t"></div><div class="fade b"></div>
<div id="loading">reading point cloud …</div>

<div class="hud top">
  <span><a href="experiments.html">← experiments</a> <em>//</em> geometry <em>of</em> societies <em>—</em> atlas_01</span>
  <span>layer <em>point cloud</em> // points <em id="npts">…</em></span>
</div>

<div class="hud bottom">
  <div class="cell"><div class="k">cursor</div><div class="v" id="cursor">— / —</div></div>
  <div class="cell"><div class="k">country</div><div class="v" id="country">—</div></div>
  <div class="cell opt"><div class="k">objects detected</div><div class="v" id="nobj">0</div></div>
  <div class="cell opt"><div class="k">scan</div><div class="v" id="scan">000.0°</div></div>
  <div class="cell" style="text-align:right"><div class="title">the green steel transition, worldwide</div></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---- settings you can edit ---------------------------------------- */
const HEIGHT   = 12;     // how tall the mountains are
const POINT    = 1.15;   // dot size
const SCAN_SEC = 6;      // seconds for the opening scan, west → east
// countries that get a detection box (ISO numeric id → short code)
const OBJECTS = {
  '528': 'NLD', '276': 'DEU', '752': 'SWE', '156': 'CHN', '356': 'IND', '392': 'JPN',
  '840': 'USA', '410': 'KOR', '643': 'RUS', '076': 'BRA', '792': 'TUR',
};
/* -------------------------------------------------------------------- */

const ACCENT = new THREE.Color('#c8e054');
const [buf, countries] = await Promise.all([
  fetch('maps/world_points.bin').then(r => r.arrayBuffer()),
  fetch('maps/countries.json').then(r => r.json()),
]);
document.getElementById('loading').remove();

/* ---------- land points ---------- */
const raw = new Int16Array(buf), N = raw.length / 4;
const pos = new Float32Array(N * 3), elev = new Float32Array(N), cidx = new Float32Array(N);
const grid = new Map();                        // 1° cells → country, for hover lookup
for (let i = 0; i < N; i++) {
  const lon = raw[i*4] / 100, lat = raw[i*4+1] / 100, e = raw[i*4+2] / 255;
  pos[i*3] = lon; pos[i*3+1] = e * HEIGHT + Math.random() * .12; pos[i*3+2] = -lat;
  elev[i] = e; cidx[i] = raw[i*4+3];
  grid.set(Math.floor(lon) + ',' + Math.floor(lat), raw[i*4+3]);
}
document.getElementById('npts').textContent = N.toLocaleString('en');

/* ---------- sea dust + sky dust (faint, gives the surface a floor) ---------- */
const dust = [];
for (let i = 0; i < 26000; i++) {
  const lon = Math.random() * 360 - 180, lat = Math.random() * 142 - 58;
  if (grid.has(Math.floor(lon) + ',' + Math.floor(lat))) continue;
  dust.push(lon, -.4, -lat, 0, -2);
}
for (let i = 0; i < 1800; i++) dust.push(Math.random() * 520 - 260, 20 + Math.random() * 90, -(Math.random() * 300 - 150), 0, -3);
const D = dust.length / 5, dpos = new Float32Array(D * 3), delev = new Float32Array(D), didx = new Float32Array(D);
for (let i = 0; i < D; i++) { dpos[i*3] = dust[i*5]; dpos[i*3+1] = dust[i*5+1]; dpos[i*3+2] = dust[i*5+2]; delev[i] = 0; didx[i] = dust[i*5+4]; }

/* ---------- one shader for every dot ---------- */
const uniforms = {
  uSize: { value: POINT * devicePixelRatio }, uHover: { value: -9 }, uSweep: { value: -200 },
  uAccent: { value: ACCENT },
};
const material = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float elev; attribute float cidx;
    uniform float uSize, uHover, uSweep;
    varying float vA; varying float vHot;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      float d = -mv.z;
      float hot = abs(cidx - uHover) < .5 ? 1. : 0.;
      float edge = smoothstep(0., 6., uSweep - position.x);          // scan front
      float front = 1. - smoothstep(0., 3., abs(uSweep - position.x));
      float a;
      if (cidx < -2.5)      a = .35;                                  // sky
      else if (cidx < -1.5) a = .09 * edge;                           // sea
      else                  a = (.32 + .68 * elev) * edge + front * .8;
      a *= clamp(1.7 - d / 230., .12, 1.);
      a = mix(a, min(1., a * 2. + .3), hot);
      vA = a; vHot = hot;
      gl_PointSize = clamp(uSize * (1. + elev * 1.3 + hot * .6) * 140. / d, 1., 7.);
    }`,
  fragmentShader: `
    uniform vec3 uAccent; varying float vA; varying float vHot;
    void main() {
      vec2 c = gl_PointCoord - .5;
      if (dot(c, c) > .25) discard;
      gl_FragColor = vec4(mix(vec3(.95,.95,.93), uAccent, vHot), vA);
    }`,
});
const cloud = (p, e, c) => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('elev', new THREE.BufferAttribute(e, 1));
  g.setAttribute('cidx', new THREE.BufferAttribute(c, 1));
  return new THREE.Points(g, material);
};

/* ---------- scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(cloud(pos, elev, cidx), cloud(dpos, delev, didx));

const camera = new THREE.PerspectiveCamera(42, 1, .5, 2000);
camera.position.set(4, 58, 46);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(22, 0, -42);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.maxPolarAngle = Math.PI * .44; controls.minDistance = 12; controls.maxDistance = 320;
controls.screenSpacePanning = false;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  svg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
}

/* ---------- detection boxes (SVG drawn over the canvas) ---------- */
const svg = document.getElementById('boxes'), NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
const GLYPHS = ':+-=#%*.';
const objects = countries.filter(c => OBJECTS[c.id] && c.bounds).map((c, k) => {
  let [[x0, y0], [x1, y1]] = c.bounds;
  if (x1 < x0) x1 = 180;                                    // wraps the date line (Russia)
  const g = el('g', { opacity: 0 }, svg);
  const o = {
    c, code: OBJECTS[c.id], g, x0, x1, y0, y1, seen: false,
    rect: el('rect', {}, g), lead: el('polyline', { fill: 'none', stroke: 'currentColor' }, g),
    glyph: el('text', { class: 'glyph' }, g),
    t1: el('text', { class: 'dim' }, g), t2: el('text', {}, g), t3: el('text', {}, g), t4: el('text', { class: 'dim' }, g),
  };
  o.lead.style.color = 'var(--ink)'; o.lead.setAttribute('stroke-width', '.5');
  o.t1.textContent = `object (${String(k + 1).padStart(2, '0')})`;
  o.t2.textContent = o.code + '.steel';
  o.t3.textContent = c.name.toLowerCase();
  o.t4.textContent = 'awaiting data';
  // the box is the country's main landmass, from sea level up to its highest dot
  let top = 0;
  for (let i = 0; i < N; i++) if (cidx[i] === c.i && pos[i*3+1] > top) top = pos[i*3+1];
  o.corners = [];
  for (const x of [x0, x1]) for (const z of [-y0, -y1]) for (const y of [0, top]) o.corners.push(new THREE.Vector3(x, y, z));
  return o;
});

const v = new THREE.Vector3();
function drawBoxes(t) {
  let shown = 0; const placed = [];
  for (const o of objects) {
    if (!o.seen && uniforms.uSweep.value > o.x1) o.seen = t;
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, ok = true;
    for (const p of o.corners) {
      v.copy(p).project(camera);
      if (v.z > 1) { ok = false; break; }
      const sx = (v.x + 1) / 2 * innerWidth, sy = (1 - v.y) / 2 * innerHeight;
      minX = Math.min(minX, sx); maxX = Math.max(maxX, sx); minY = Math.min(minY, sy); maxY = Math.max(maxY, sy);
    }
    const w = maxX - minX, h = maxY - minY;
    ok = ok && o.seen && w > 6 && maxX > 0 && minX < innerWidth && maxY > 0 && minY < innerHeight && w < innerWidth * .8;
    o.g.setAttribute('opacity', ok ? Math.min(1, (t - o.seen) / 600) : 0);
    if (!ok) continue;
    shown++;
    o.g.classList.toggle('hot', uniforms.uHover.value === o.c.i);
    o.rect.setAttribute('x', minX); o.rect.setAttribute('y', minY);
    o.rect.setAttribute('width', w); o.rect.setAttribute('height', h);
    // leader line out of the top-right corner, then the label
    placed.push({ o, ax: maxX, ay: minY, lx: maxX + 26, ly: minY - 18 });
    // a flicker of scanner glyphs along the top edge
    if (Math.random() < .08) o.glyph.textContent = Array.from({ length: Math.max(2, Math.min(40, w / 7 | 0)) }, () => Math.random() < .6 ? ' ' : GLYPHS[Math.random() * GLYPHS.length | 0]).join('');
    o.glyph.setAttribute('x', minX); o.glyph.setAttribute('y', minY - 4);
  }
  // labels never overlap: push each one down until it clears the ones above it
  placed.sort((a, b) => a.ly - b.ly);
  placed.forEach((p, i) => {
    for (let j = 0; j < i; j++) {
      const q = placed[j];
      if (Math.abs(p.lx - q.lx) < 130 && p.ly < q.ly + 58) p.ly = q.ly + 58;
    }
    p.o.lead.setAttribute('points', `${p.ax},${p.ay} ${p.lx},${p.ly} ${p.lx + 18},${p.ly}`);
    [p.o.t1, p.o.t2, p.o.t3, p.o.t4].forEach((n, k) => { n.setAttribute('x', p.lx + 24); n.setAttribute('y', p.ly + 3 + k * 13); });
  });
  document.getElementById('nobj').textContent = shown + ' / ' + objects.length;
}

/* ---------- hover: cursor → map coordinates → country ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
const byIndex = new Map(countries.map(c => [c.i, c]));
renderer.domElement.addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  if (!ray.ray.intersectPlane(plane, hit)) return;
  const lon = hit.x, lat = -hit.z;
  const fmt = (n, p, m) => Math.abs(n).toFixed(2).padStart(6, '0') + '° ' + (n >= 0 ? p : m);
  document.getElementById('cursor').textContent = Math.abs(lat) > 90 || Math.abs(lon) > 180 ? '— / —' : fmt(lat, 'N', 'S') + ' / ' + fmt(lon, 'E', 'W');
  const c = grid.get(Math.floor(lon) + ',' + Math.floor(lat));
  uniforms.uHover.value = c ?? -9;
  document.getElementById('country').textContent = c != null ? byIndex.get(c).name.toLowerCase() : '—';
});

/* ---------- loop ---------- */
addEventListener('resize', resize); resize();
const t0 = performance.now();
renderer.setAnimationLoop(t => {
  const s = Math.min(1, (t - t0) / (SCAN_SEC * 1000));
  uniforms.uSweep.value = -190 + s * 400;
  document.getElementById('scan').textContent = (s * 360).toFixed(1).padStart(5, '0') + '°';
  controls.update();
  renderer.render(scene, camera);
  drawBoxes(t);
});
</script>
</body>
</html>
