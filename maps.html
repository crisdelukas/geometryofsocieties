<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maps — geometry of societies</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<style>
  :root {
    --ink: #e8e8e4;
    --muted: #6f6f6b;
    --line: #2a2a28;
    --paper: #000;
    --accent: #c8e054;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
  body { font-family: var(--mono); font-size: 11px; letter-spacing: .02em; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }
  button { all: unset; cursor: pointer; }

  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* ---------- drawn over the map ---------- */
  #over { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #over text { font-family: var(--mono); font-size: 10px; fill: var(--ink); paint-order: stroke; stroke: #000; stroke-width: 3px; stroke-linejoin: round; }
  #over .dim { fill: var(--muted); }
  #over .box rect { fill: none; stroke: var(--ink); stroke-width: .75; }
  #over .box polyline { fill: none; stroke: var(--ink); stroke-width: .5; }
  #over .box.sel rect { stroke: var(--accent); }
  #over .box.quiet rect { stroke: #5a5a57; }
  #over .box.quiet text:not(:nth-of-type(1)), #over .box.quiet polyline { display: none; }
  #over .box.quiet text { fill: var(--muted); }
  #over .plant line { stroke: var(--muted); stroke-width: .5; }
  #over .plant rect { fill: #000; stroke: var(--ink); stroke-width: 1; }
  #over .plant.transition rect { fill: var(--accent); stroke: var(--accent); }

  /* ---------- status line, bottom left ---------- */
  .status { position: fixed; left: 16px; bottom: 14px; display: flex; gap: 28px; color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; }
  .status b { color: var(--ink); font-weight: 400; margin-left: 8px; }
  .back { position: fixed; left: 16px; top: 14px; color: var(--muted); }

  /* ---------- foldable right menu ---------- */
  #tab {
    position: fixed; top: 12px; right: 12px; z-index: 6; width: 28px; height: 28px;
    border: .5px solid var(--line); background: #000; display: grid; place-items: center;
    transition: right .45s cubic-bezier(.2,.7,.1,1);
  }
  #tab:hover { border-color: var(--ink); }
  #tab svg { width: 12px; height: 12px; stroke: var(--ink); fill: none; stroke-width: 1.2; }
  body.menu #tab { right: calc(min(340px, 100vw) + 12px); }
  #menu {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 100vw); z-index: 5;
    background: #000; border-left: .5px solid var(--line);
    transform: translateX(100%); transition: transform .45s cubic-bezier(.2,.7,.1,1);
    overflow-y: auto; scrollbar-width: thin; scrollbar-color: #333 #000;
  }
  body.menu #menu { transform: none; }
  .grp { border-bottom: .5px solid var(--line); padding: 14px 16px; }
  .grp > .h { color: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 12px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .check::before { content: ''; width: 9px; height: 9px; border: 1px solid var(--muted); flex: none; }
  .check.on::before { background: var(--ink); border-color: var(--ink); }
  .check:hover { color: var(--accent); }
  .key { display: flex; gap: 14px; color: var(--muted); font-size: 9.5px; margin: 6px 0 0 19px; }
  .key i { display: inline-block; width: 7px; height: 7px; border: 1px solid var(--ink); margin-right: 6px; vertical-align: -1px; }
  .key i.t { background: var(--accent); border-color: var(--accent); }
  .hint { color: var(--muted); }
  #plantsCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .key i.c { border-style: dotted; border-color: var(--muted); }
  summary i { font-style: normal; color: var(--muted); margin-left: 6px; }
  .fig .v.txt, .fig .txt { font-family: var(--sans); font-size: 11.5px; line-height: 1.45; }
  .fig sup a, .row sup a { color: var(--muted); font-size: 8.5px; margin-left: 2px; }
  .row .m { color: var(--muted); }
  .st { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink); flex: none; }
  .st.operating { background: var(--accent); border-color: var(--accent); }
  .st.construction { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border-color: var(--accent); }
  .st.announced { border-color: var(--ink); }
  .st.paused { border-color: #e0a84a; }
  .st.cancelled { border-color: #e05a4a; border-radius: 0; transform: rotate(45deg) scale(.85); }
  .st.finalized { border-style: dotted; border-color: var(--muted); }
  .sq { width: 6px; height: 6px; border: 1px solid var(--ink); flex: none; }
  .sq.t { background: var(--accent); border-color: var(--accent); }
  .sq.c { border-style: dotted; border-color: var(--muted); }
  .credit { padding: 14px 16px 28px; color: var(--muted); font-size: 9.5px; line-height: 1.8; display: flex; flex-direction: column; }
  .credit b { font-weight: 400; display: inline-block; width: 16px; }
  .credit a:hover { color: var(--ink); }

  .name { font-family: var(--sans); font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .figs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; margin-top: 14px; }
  .fig .k { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
  .fig .v { font-size: 12px; font-variant-numeric: tabular-nums; }
  details { border-bottom: .5px solid var(--line); }
  summary { list-style: none; cursor: pointer; padding: 11px 16px; display: flex; justify-content: space-between; text-transform: uppercase; font-size: 9.5px; letter-spacing: .1em; color: var(--muted); }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '+'; }
  details[open] summary::after { content: '−'; }
  summary:hover { color: var(--ink); }
  .rows { padding: 0 16px 12px; }
  .row { padding: 7px 0; }
  .row .k { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
  .row .v { font-family: var(--sans); font-size: 11.5px; line-height: 1.45; }
  .row sup a { color: var(--muted); font-family: var(--mono); font-size: 8.5px; margin-left: 2px; }
  .src { font-size: 9.5px; color: var(--muted); line-height: 1.7; }
  /* certainty: filled = high, half = medium, dotted = interpretation */
  .c { width: 6px; height: 6px; border: 1px solid var(--ink); flex: none; display: inline-block; }
  .c.high { background: var(--ink); }
  .c.medium { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
  .c.low { border-style: dotted; border-color: var(--muted); }
  @media (max-width: 640px) { .status span:nth-child(2) { display: none; } }
</style>
</head>
<body>

<div id="stage"></div>
<canvas id="plantsCanvas"></canvas>
<svg id="over"></svg>
<a class="back" href="experiments.html">← experiments</a>
<div class="status"><span>cursor<b id="cursor">—</b></span><span>country<b id="hover">—</b></span><span id="plantHover"></span></div>

<button id="tab" aria-label="toggle menu" title="layers">
  <svg viewBox="0 0 12 12"><path d="M1 3h10M1 6h10M1 9h10"/></svg>
</button>
<aside id="menu" aria-label="layers and country details">
  <div class="grp">
    <div class="h">layers</div>
    <button class="check" data-layer="boxes">countries with ongoing projects</button>
    <button class="check" data-layer="plants">steel factories</button>
    <div class="key" id="plantKey" hidden><span><i class="t"></i>in transition</span><span><i></i>conventional</span><span><i class="c"></i>building</span></div>
  </div>
  <div id="country"><div class="grp hint">select a country on the map</div></div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---- settings you can edit ---------------------------------------- */
const HEIGHT = 12;      // how tall the mountains are
const POINT  = 1.0;     // dot size
const LENS   = 28;      // camera lens (smaller = flatter, more axonometric)
/* -------------------------------------------------------------------- */

const json = (u, fallback) => fetch(u).then(r => r.ok ? r.json() : fallback).catch(() => fallback);
const [buf, countries, WORLD, PLANTS, DEEP] = await Promise.all([
  fetch('world_points.bin').then(r => r.arrayBuffer()),
  fetch('countries.json').then(r => r.json()),
  json('atlas_world.json', { _meta: {}, _ids: {} }),     // GEM + LeadIT, every country
  json('atlas_plants.json', []),                          // every operating / building steel plant
  json('atlas_data.json', {}),                            // researched panels, country by country
]);
const byIndex = new Map(countries.map(c => [c.i, c]));
const isoOf = c => WORLD._ids[c.id];
const worldOf = c => { const w = WORLD[isoOf(c)]; return w && { ...w, iso: isoOf(c) }; };
const deepOf = c => DEEP[isoOf(c)];

/* ---------- points ---------- */
const raw = new Int16Array(buf), N = raw.length / 4;
const pos = new Float32Array(N * 3), elev = new Float32Array(N), cidx = new Float32Array(N);
const grid = new Map();                        // 1° cells → country, for hover and click
for (let i = 0; i < N; i++) {
  const lon = raw[i*4] / 100, lat = raw[i*4+1] / 100, e = raw[i*4+2] / 255;
  pos[i*3] = lon; pos[i*3+1] = e * HEIGHT + Math.random() * .1; pos[i*3+2] = -lat;
  elev[i] = e; cidx[i] = raw[i*4+3];
  grid.set(Math.floor(lon) + ',' + Math.floor(lat), raw[i*4+3]);
}
const groundAt = (lon, lat) => {               // height of the cloud near a place
  let y = 0;
  for (let i = 0; i < N; i++) if (Math.abs(pos[i*3] - lon) < .6 && Math.abs(-pos[i*3+2] - lat) < .6) y = Math.max(y, pos[i*3+1]);
  return y;
};

const uniforms = { uSize: { value: POINT * devicePixelRatio }, uRise: { value: 0 }, uHover: { value: -9 }, uSel: { value: -9 }, uAccent: { value: new THREE.Color('#c8e054') } };
const material = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float elev; attribute float cidx;
    uniform float uSize, uRise, uHover, uSel;
    varying float vA; varying float vSel;
    void main() {
      vec3 p = position; p.y *= uRise;                       // dots rise to their height on load
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float d = -mv.z;
      float sel = abs(cidx - uSel) < .5 ? 1. : 0.;
      float hov = abs(cidx - uHover) < .5 ? 1. : 0.;
      float a = (.48 + .52 * elev) * clamp(1.6 - d / 520., .35, 1.) * smoothstep(0., .35, uRise);
      a = mix(a, min(1., a + .25), max(hov, sel));
      vA = a; vSel = sel;
      gl_PointSize = clamp(uSize * (1. + elev) * 260. / d, 1., 5.);
    }`,
  fragmentShader: `
    uniform vec3 uAccent; varying float vA; varying float vSel;
    void main() {
      vec2 c = gl_PointCoord - .5;
      if (dot(c, c) > .25) discard;
      gl_FragColor = vec4(mix(vec3(1.,1.,.98), uAccent, vSel), vA);
    }`,
});
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('elev', new THREE.BufferAttribute(elev, 1));
geo.setAttribute('cidx', new THREE.BufferAttribute(cidx, 1));

/* ---------- scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setClearColor(0x000000);
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.Points(geo, material));

// coordinate grid like Rhino: 10° base squares, each split into 10 × 10 subdivisions
function gridLines(step, skip, color, y) {
  const gl = [];
  for (let lon = -180; lon <= 180; lon += step) if (!skip || lon % skip) gl.push(lon, y, 60, lon, y, -90);
  for (let lat = -60; lat <= 90; lat += step) if (!skip || lat % skip) gl.push(-180, y, -lat, 180, y, -lat);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(gl, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color }));
}
scene.add(gridLines(1, 10, 0x121211, -.52));   // subdivisions, a few tones darker
scene.add(gridLines(10, 0, 0x1c1c1b, -.5));    // base squares

const camera = new THREE.PerspectiveCamera(LENS, 1, 1, 3000);
camera.position.set(-6, 95, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(22, 0, -42);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.maxPolarAngle = Math.PI * .42; controls.minDistance = 15; controls.maxDistance = 520;
controls.screenSpacePanning = false;

const right = new THREE.Vector3();
document.getElementById('stage').addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || e.ctrlKey) return;     // vertical swipe / pinch → normal zoom
  e.preventDefault(); e.stopPropagation();
  fly.on = false;
  right.setFromMatrixColumn(camera.matrix, 0); right.y = 0; right.normalize();
  const d = camera.position.distanceTo(controls.target) * .0007 * e.deltaX;
  right.multiplyScalar(d);
  camera.position.add(right); controls.target.add(right);
}, { capture: true, passive: false });

// never let the view drift off the edge of the world
function clampView() {
  const t = controls.target, cx = Math.max(-180, Math.min(180, t.x)) - t.x, cz = Math.max(-85, Math.min(58, t.z)) - t.z;
  if (cx || cz) { t.x += cx; t.z += cz; camera.position.x += cx; camera.position.z += cz; }
}

/* ---------- overlay (boxes + factories) ---------- */
const over = document.getElementById('over'), NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
const layers = { boxes: false, plants: false };
const v = new THREE.Vector3();
const toScreen = p => { v.copy(p).project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, behind: v.z > 1 }; };
const ongoing = w => w ? w.projects.operating + w.projects.construction + w.projects.announced : 0;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const statusText = (st, short) => [['operating', 'op'], ['construction', 'constr'], ['announced', 'ann'], ['paused', 'paused'], ['cancelled', 'canc'], ['finalized', 'R&D done']]
  .filter(([k]) => st[k]).map(([k, s]) => st[k] + ' ' + (short ? s : k === 'finalized' ? 'R&D finished' : k)).join(' · ');

// boxes: countries with ongoing green steel projects
const boxes = countries.filter(c => c.bounds && ongoing(worldOf(c)) > 0).map(c => {
  const w = worldOf(c);
  let [[x0, y0], [x1, y1]] = c.bounds; if (x1 < x0) x1 = 180;
  let top = 0; for (let i = 0; i < N; i++) if (cidx[i] === c.i && pos[i*3+1] > top) top = pos[i*3+1];
  const corners = [];
  for (const x of [x0, x1]) for (const z of [-y0, -y1]) for (const y of [0, top]) corners.push(new THREE.Vector3(x, y, z));
  const g = el('g', { class: 'box' }, over);
  const b = { c, g, corners, rect: el('rect', {}, g), lead: el('polyline', {}, g), head: el('text', { 'text-anchor': 'end' }, g),
    lines: [el('text', {}, g), el('text', { class: 'dim' }, g), el('text', { class: 'dim' }, g)],
    // the header cycles through these, typing itself in
    cycle: [plural(w.project_list.length, 'green steel project'), `${w.qualified} qualify as green`, plural(w.plants, 'steel plant'), `${w.plants_transition} in transition`] };
  b.lines[0].textContent = c.name.toLowerCase();
  b.lines[1].textContent = `capacity ${w.capacity_mt} Mt/y`;
  b.lines[2].textContent = statusText(w.projects);
  return b;
});

// factories: drawn on a canvas (≈1,000 of them)
const pc = document.getElementById('plantsCanvas'), px = pc.getContext('2d');
const plants = PLANTS.map(([name, iso, lat, lon, st, route, cap, parent, tr]) =>
  ({ name, iso, st, route, cap, parent, tr, ground: new THREE.Vector3(lon, groundAt(lon, lat), -lat), sx: -1, sy: -1, on: false }));
const ink = getComputedStyle(document.documentElement);
function drawOverlay(t) {
  const placed = [];
  for (const b of boxes) {
    b.g.style.display = layers.boxes ? '' : 'none';
    if (!layers.boxes) continue;
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, ok = true;
    for (const p of b.corners) {
      const s = toScreen(p); if (s.behind) { ok = false; break; }
      minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x); minY = Math.min(minY, s.y); maxY = Math.max(maxY, s.y);
    }
    if (!ok || maxX < 0 || minX > innerWidth || maxY < 0 || minY > innerHeight || maxX - minX > innerWidth * .9) { b.g.style.display = 'none'; continue; }
    b.g.classList.toggle('sel', uniforms.uSel.value === b.c.i);
    const focus = uniforms.uSel.value === b.c.i || uniforms.uHover.value === b.c.i;   // full label only when looked at
    b.g.classList.toggle('quiet', !focus);
    Object.entries({ x: minX, y: minY, width: maxX - minX, height: maxY - minY }).forEach(([k, val]) => b.rect.setAttribute(k, val));
    if (!focus) { b.head.textContent = b.c.name.toLowerCase(); b.head.setAttribute('x', maxX); b.head.setAttribute('y', minY - 5); continue; }
    const phase = t / 2600, word = b.cycle[Math.floor(phase) % b.cycle.length];
    b.head.textContent = word.slice(0, Math.ceil(word.length * Math.min(1, (phase % 1) * 4)));
    b.head.setAttribute('x', maxX); b.head.setAttribute('y', minY - 5);
    placed.push({ b, ax: maxX, ay: minY, lx: maxX + 24, ly: minY - 16 });
  }
  // labels never overlap: push each one down until it clears the ones above it
  placed.sort((a, b) => a.ly - b.ly).forEach((p, i) => {
    for (let j = 0; j < i; j++) { const q = placed[j]; if (Math.abs(p.lx - q.lx) < 170 && p.ly < q.ly + 44) p.ly = q.ly + 44; }
    p.b.lead.setAttribute('points', `${p.ax},${p.ay} ${p.lx},${p.ly} ${p.lx + 14},${p.ly}`);
    p.b.lines.forEach((n, k) => { n.setAttribute('x', p.lx + 20); n.setAttribute('y', p.ly + 3 + k * 13); });
  });

  // factories
  const dpr = devicePixelRatio;
  px.setTransform(dpr, 0, 0, dpr, 0, 0); px.clearRect(0, 0, innerWidth, innerHeight);
  if (!layers.plants) return;
  const selIso = selected ? isoOf(selected) : null;
  px.font = '10px ui-monospace, Menlo, monospace'; px.lineWidth = 1;
  const labels = [];                                   // label boxes already drawn — skip any that would overlap
  const order = selIso ? plants.slice().sort((a, b) => (a.iso === selIso) - (b.iso === selIso) || (a.tr - b.tr) * -1 || b.cap - a.cap) : plants;
  for (const f of order) {
    const s = toScreen(f.ground);
    f.on = !s.behind && s.x > -10 && s.x < innerWidth + 10 && s.y > -10 && s.y < innerHeight + 10;
    if (!f.on) continue;
    f.sx = s.x; f.sy = s.y - 12;
    const size = f.cap > 5000 ? 6 : f.cap > 1500 ? 5 : 4;
    px.strokeStyle = 'rgba(232,232,228,.35)'; px.beginPath(); px.moveTo(s.x + .5, s.y); px.lineTo(s.x + .5, f.sy); px.stroke();
    if (f.tr) { px.fillStyle = '#c8e054'; px.fillRect(s.x - size / 2, f.sy - size, size, size); }
    else {
      px.fillStyle = '#000'; px.fillRect(s.x - size / 2, f.sy - size, size, size);
      px.strokeStyle = f.st === 'c' ? 'rgba(232,232,228,.45)' : '#e8e8e4';
      px.setLineDash(f.st === 'c' ? [1.5, 1.5] : []); px.strokeRect(s.x - size / 2 + .5, f.sy - size + .5, size - 1, size - 1); px.setLineDash([]);
    }
    if (selIso && f.iso === selIso && (f.cap >= labelMin || f.tr)) {
      const wdt = px.measureText(f.name.toLowerCase()).width + 4, box = [s.x + 6, f.sy - 10, wdt, 12];
      if (!labels.some(b => box[0] < b[0] + b[2] && b[0] < box[0] + box[2] && box[1] < b[1] + b[3] + 2 && b[1] < box[1] + box[3] + 2)) {
        labels.push(box);
        px.fillStyle = '#000'; px.globalAlpha = .75; px.fillRect(...box); px.globalAlpha = 1;
        px.fillStyle = f.tr ? '#c8e054' : '#e8e8e4'; px.fillText(f.name.toLowerCase(), s.x + 8, f.sy - 1);
      }
    }
  }
}
let labelMin = 0;                                  // in a big country, only label the larger plants

/* ---------- menu ---------- */
const menu = document.getElementById('menu'), countryBox = document.getElementById('country');
const setMenu = open => { document.body.classList.toggle('menu', open); fly.offsetTo = open && innerWidth > 640 ? menu.offsetWidth / 2 : 0; };
document.getElementById('tab').onclick = () => setMenu(!document.body.classList.contains('menu'));
document.querySelectorAll('[data-layer]').forEach(btn => btn.onclick = () => {
  layers[btn.dataset.layer] = !layers[btn.dataset.layer];
  btn.classList.toggle('on', layers[btn.dataset.layer]);
  document.getElementById('plantKey').hidden = !layers.plants;
});

const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CERT = { high: 'official or primary source', medium: 'reported, estimated or disputed', low: 'interpretation' };
const META = WORLD._meta;
function showCountry(c) {
  const w = worldOf(c), d = deepOf(c);
  if (!w && !d) { countryBox.innerHTML = `<div class="grp"><div class="name">${esc(c.name)}</div><div class="hint" style="margin-top:8px">no large steel plants or green projects tracked</div></div>${credit([])}`; return; }
  // sources: dataset credits first, then the research sources, numbered in order of use
  const srcs = { ...(d?.sources || {}), gem: META.gem, leadit: META.leadit };
  const used = [];
  const ref = id => { if (!srcs[id]) return ''; if (!used.includes(id)) used.push(id); const s = srcs[id];
    return `<sup><a href="${esc(s.u)}" target="_blank" rel="noopener" title="${esc(s.t)} · ${esc(s.d)}">${used.indexOf(id) + 1}</a></sup>`; };
  const row = (k, val, c, src) => `<div class="row"><div class="k"><span class="c ${c}" title="${CERT[c]}"></span>${esc(k)}</div><div class="v">${esc(val)}${(src || []).map(ref).join('')}</div></div>`;
  const fold = (title, inner, n) => inner ? `<details><summary><span>${esc(title)}${n != null ? ` <i>${n}</i>` : ''}</span></summary><div class="rows">${inner}</div></details>` : '';
  const fig = (k, val, wide) => `<div class="fig"${wide ? ' style="grid-column:1/-1"' : ''}><div class="k">${k}</div><div class="v">${val}</div></div>`;

  let figs = '', folds = '';
  if (w) {
    const bf = w.capacity_mt ? Math.round(w.bof_mt / w.capacity_mt * 100) : 0, eaf = w.capacity_mt ? Math.round(w.eaf_mt / w.capacity_mt * 100) : 0;
    figs += fig('capacity', `${w.capacity_mt} Mt/y${ref('gem')}`) + fig('route mix', `${bf}% blast furnace · ${eaf}% electric`);
    figs += fig('steel plants', `${w.plants}${w.plants_transition ? ` · ${w.plants_transition} in transition` : ''}${w.plants_construction ? ` · ${w.plants_construction} building` : ''}`);
    figs += fig('green projects', w.project_list.length ? `${w.project_list.length} · ${w.qualified} qualify${ref('leadit')}` : 'none tracked');
    if (w.project_list.length) figs += fig('project status', statusText(w.projects), true);
    const pl = w.project_list.slice().sort((a, b) => ['operating', 'construction', 'announced', 'paused', 'cancelled', 'finalized'].indexOf(a.status) - ['operating', 'construction', 'announced', 'paused', 'cancelled', 'finalized'].indexOf(b.status));
    folds += fold('green steel projects', pl.map(p => `<div class="row"><div class="k"><span class="st ${p.status}"></span>${esc(p.status === 'finalized' ? 'R&D finished' : p.status)}${p.qualified ? ' · qualifies as green' : ''}</div>
      <div class="v">${esc(/not available/i.test(p.name) ? 'unnamed project' : p.name)} <span class="m">— ${esc(p.company)}${p.scale ? ', ' + esc(p.scale.toLowerCase()) : ''}${p.steel_mt ? `, ${p.steel_mt} Mt steel` : p.iron_mt ? `, ${p.iron_mt} Mt iron` : ''}${p.commissioning && !['finalized', 'cancelled', 'operating'].includes(p.status) ? `, planned ${p.commissioning}` : ''}</span></div></div>`).join(''), pl.length);
    const mine = plants.filter(f => f.iso === w.iso).sort((a, b) => b.cap - a.cap);
    folds += fold('steel plants', mine.map(f => `<div class="row"><div class="k"><span class="sq ${f.tr ? 't' : f.st === 'c' ? 'c' : ''}"></span>${esc(f.route)}${f.st === 'c' ? ' · under construction' : ''}${f.tr ? ' · in transition' : ''}</div><div class="v">${esc(f.name)} <span class="m">— ${(f.cap / 1000).toFixed(1)} Mt/y${f.parent ? ', ' + esc(f.parent) : ''}</span></div></div>`).join(''), mine.length);
  }
  let head = '';
  if (d) {
    head = `<div class="fig" style="grid-column:1/-1"><div class="k"><span class="c ${d.overall.certainty}" title="${CERT[d.overall.certainty]}"></span> certainty · ${d.overall.certainty}</div><div class="v txt">${esc(d.overall.text)}</div></div>`;
    folds += d.sections.map(s => fold(s.title, s.rows.map(r => row(r.k, r.v, r.c, r.src)).join(''))).join('');
  }
  countryBox.innerHTML = `<div class="grp"><div class="name">${esc(c.name)}</div><div class="figs">${head}${figs}</div></div>${folds}${credit(used.map(id => srcs[id]))}`;
}
// elegant source line: publisher · date, numbered as cited
const credit = list => `<div class="credit">${list.length ? list.map((s, i) => `<span><b>${i + 1}</b><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a> · ${esc(s.d)}</span>`).join('') : ''}</div>`;

/* ---------- camera flight ---------- */
const fly = { on: false, target: new THREE.Vector3(), dist: 90, offset: 0, offsetTo: 0 };
let selected = null;
function select(c) {
  uniforms.uSel.value = c ? c.i : -9; selected = c;
  if (c) { const caps = plants.filter(f => f.iso === isoOf(c)).map(f => f.cap).sort((a, b) => b - a); labelMin = caps.length > 8 ? caps[7] : 0; }
  if (!c) { countryBox.innerHTML = '<div class="grp hint">select a country on the map</div>'; return; }
  showCountry(c); setMenu(true); menu.scrollTop = 0;
  if (c.centroid) {
    fly.target.set(c.centroid[0], 0, -c.centroid[1]); fly.on = true;
    const size = Math.max(Math.abs(c.bounds[1][0] - c.bounds[0][0]) % 360, c.bounds[1][1] - c.bounds[0][1]);
    fly.dist = Math.min(260, Math.max(85, size * 9));
  }
}
controls.addEventListener('start', () => fly.on = false);
function stepCamera() {
  if (fly.on) {
    const delta = fly.target.clone().sub(controls.target).multiplyScalar(.06);
    controls.target.add(delta); camera.position.add(delta);
    const dir = camera.position.clone().sub(controls.target), d = dir.length();
    camera.position.copy(controls.target).add(dir.setLength(d + (fly.dist - d) * .05));
    if (delta.length() < .01 && Math.abs(d - fly.dist) < .3) fly.on = false;
  }
  fly.offset += (fly.offsetTo - fly.offset) * .08;
  if (Math.abs(fly.offset) > .5) camera.setViewOffset(innerWidth, innerHeight, fly.offset, 0, innerWidth, innerHeight);
  else camera.clearViewOffset();
}

/* ---------- hover + click ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  if (!ray.ray.intersectPlane(plane, hit)) return null;
  return { lon: hit.x, lat: -hit.z, c: grid.get(Math.floor(hit.x) + ',' + Math.floor(-hit.z)) };
}
renderer.domElement.addEventListener('pointermove', e => {
  const p = pick(e); if (!p) return;
  const f = (n, a, b) => Math.abs(n).toFixed(2) + '°' + (n >= 0 ? a : b);
  document.getElementById('cursor').textContent = Math.abs(p.lat) > 90 || Math.abs(p.lon) > 180 ? '—' : f(p.lat, 'N', 'S') + ' ' + f(p.lon, 'E', 'W');
  uniforms.uHover.value = p.c ?? -9;
  document.getElementById('hover').textContent = p.c != null ? byIndex.get(p.c).name.toLowerCase() : '—';
  let best = null, bd = 64;
  if (layers.plants) for (const f of plants) if (f.on) { const d = (f.sx - e.clientX) ** 2 + (f.sy - 3 - e.clientY) ** 2; if (d < bd) { bd = d; best = f; } }
  const ph = document.getElementById('plantHover');
  ph.innerHTML = best ? `plant<b>${esc(best.name.toLowerCase())} · ${(best.cap / 1000).toFixed(1)} Mt/y · ${esc(best.route)}${best.tr ? ' · in transition' : ''}</b>` : '';
});
let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;  // that was a drag
  const p = pick(e);
  select(p && p.c != null ? byIndex.get(p.c) : null);
});
addEventListener('keydown', e => { if (e.key === 'Escape') { select(null); setMenu(false); } });

/* ---------- loop ---------- */
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  over.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
  pc.width = innerWidth * devicePixelRatio; pc.height = innerHeight * devicePixelRatio;
}
addEventListener('resize', resize); resize();
const t0 = performance.now();
renderer.setAnimationLoop(t => {
  const k = Math.min(1, (t - t0) / 1400);
  uniforms.uRise.value = 1 - Math.pow(1 - k, 3);               // quick ease-out
  stepCamera(); clampView(); controls.update();
  renderer.render(scene, camera);
  drawOverlay(t);
});
</script>
</body>
</html>
