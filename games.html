<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>games — geometry of societies</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<style>
  :root {
    --ink: #111;
    --muted: #9a9a96;
    --paper: #fff;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --board: min(560px, calc(100vw - 32px));
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  a { color: inherit; text-decoration: none; }

  .meta {
    font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
    padding: 16px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .meta em { font-style: italic; color: var(--muted); }
  .meta a:hover { text-decoration: underline; }

  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 72px; display: flex; flex-direction: column; align-items: center; }

  /* 10 × 10: a margin row/column around the 8 × 8 board */
  .board {
    width: var(--board); height: var(--board);
    display: grid;
    grid-template-columns: 0.55fr repeat(8, 1fr) 0.55fr;
    grid-template-rows: 0.55fr repeat(8, 1fr) 0.55fr;
  }
  .coord {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    opacity: 0; transition: opacity .5s ease;
  }
  .sq {
    position: relative; display: block;
    background: var(--paper); outline: 0.5px solid var(--ink); outline-offset: -0.25px;
    opacity: 0; transition-property: opacity; transition-duration: 0ms;
  }
  .sq.dark { background: var(--ink); }
  .sq svg { position: absolute; inset: 26%; width: 48%; height: 48%; display: block; }
  .sq svg rect { fill: var(--ink); }
  .sq.dark svg rect { fill: var(--paper); }
  .sq.active { cursor: pointer; }
  .sq.active:hover, .sq.active:focus-visible { outline: 2px solid #c8e054; outline-offset: -2px; z-index: 1; }

  .readout {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    margin-top: 28px; height: 14px; text-align: center;
  }
  .readout b { color: var(--ink); font-weight: 400; }

  footer { opacity: 0; transition: opacity .8s ease; margin-top: 56px; border-top: 0.5px solid var(--ink); padding-top: 28px; text-align: center; width: 100%; }
  footer h1 { margin: 0; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>

<div class="meta">
  <span><a href="experiments.html">← experiments</a> <em>//</em> geometry <em>of</em> societies <em>—</em> v0.1</span>
  <span>squares <em>64</em> // players <em>thinking</em></span>
</div>

<main>
  <div class="board" id="board" aria-label="board of game experiments"></div>
  <div class="readout" id="readout"></div>
  <footer><h1>games of power and access</h1></footer>
</main>

<script>
/* ---- settings you can edit ---------------------------------------- */
const LINKS = {             // squares that open a game; others are placeholders
  "A1": "game_a1.html",
};
/* -------------------------------------------------------------------- */

const FILES = ['A','B','C','D','E','F','G','H'];
const board = document.getElementById('board');
const readout = document.getElementById('readout');
const SVGNS = 'http://www.w3.org/2000/svg';
const squares = [], coords = [];

// small pixel pawn, same family as the experiments icon
const PAWN = ['..###..', '.#...#.', '..###..', '..#.#..', '..#.#..', '.#...#.', '#######'];
function pawn() {
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', '0 0 7 7'); svg.setAttribute('shape-rendering', 'crispEdges'); svg.setAttribute('aria-hidden', 'true');
  PAWN.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== '#') return;
    const r = document.createElementNS(SVGNS, 'rect');
    r.setAttribute('x', x + 0.06); r.setAttribute('y', y + 0.06); r.setAttribute('width', 0.88); r.setAttribute('height', 0.88);
    svg.appendChild(r);
  }));
  return svg;
}

const coord = text => { const d = document.createElement('div'); d.className = 'coord'; d.textContent = text || ''; board.appendChild(d); coords.push(d); };

// top: A … H
coord(); FILES.forEach(f => coord(f)); coord();

// rows: left 1 … 8, right 8 … 1
for (let r = 0; r < 8; r++) {
  coord(String(r + 1));
  for (let c = 0; c < 8; c++) {
    const name = FILES[c] + (r + 1), href = LINKS[name];
    const sq = document.createElement(href ? 'a' : 'div');
    sq.className = 'sq' + ((r + c) % 2 === 0 ? ' dark' : '') + (href ? ' active' : '');
    if (href) { sq.href = href; sq.appendChild(pawn()); }
    sq.setAttribute('aria-label', name + (href ? '' : ' (not yet available)'));
    sq.addEventListener('mouseenter', () => readout.innerHTML = '<b>' + name + '</b>' + (href ? '' : ' // not yet available'));
    sq.addEventListener('mouseleave', () => readout.innerHTML = '');
    board.appendChild(sq);
    squares.push({ sq, r, c });
  }
  coord(String(8 - r));
}

// bottom: H … A
coord(); [...FILES].reverse().forEach(f => coord(f)); coord();

/* Arrival: squares switch on one by one along the diagonals, then the margins. */
const STAGGER = 45;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
squares.forEach(({ sq, r, c }) => {
  sq.style.transitionDelay = still ? '0ms' : Math.round((r + c) * STAGGER * 2.2 + Math.random() * STAGGER * 2) + 'ms';
});
const end = still ? 0 : 15 * STAGGER * 2.2 + STAGGER * 2;
coords.forEach(d => d.style.transitionDelay = end + 'ms');
document.querySelector('footer').style.transitionDelay = (end + 300) + 'ms';
requestAnimationFrame(() => requestAnimationFrame(() => {
  squares.forEach(({ sq }) => sq.style.opacity = 1);
  coords.forEach(d => d.style.opacity = 1);
  document.querySelector('footer').style.opacity = 1;
}));
</script>
</body>
</html>
