<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry of Societies</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000000; font-family: 'Space Grotesk', sans-serif; color: #e8e8e8; overflow: hidden; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; }
    .ui-band {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 1.75rem;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.55);
      border-bottom: 0.5px solid rgba(255,255,255,0.06);
      z-index: 10;
    }
    .wordmark { font-size: 11px; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase; color: #e8e8e8; }
    .wordmark em { font-style: normal; color: #c8e054; }
    .nav { display: flex; gap: 2rem; }
    .nav a {
      font-family: 'Space Mono', monospace; font-size: 8px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.25); text-decoration: none;
    }
    .nav a:hover { color: #c8e054; }
    .nav a.active { color: rgba(255,255,255,0.7); }
    .ui-bottom {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 1.75rem;
      display: flex; justify-content: space-between; align-items: flex-end;
      z-index: 10; pointer-events: none;
    }
    .bottom-left { display: flex; flex-direction: column; gap: 6px; }
    .exp-label {
      font-family: 'Space Mono', monospace; font-size: 8px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
    .exp-label em { color: #c8e054; font-style: normal; }
    .enter-btn {
      pointer-events: all;
      background: transparent;
      border: 0.5px solid rgba(200,224,84,0.4);
      padding: 8px 20px;
      font-family: 'Space Mono', monospace; font-size: 8px;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(200,224,84,0.7); cursor: pointer;
    }
    .enter-btn:hover { border-color: #c8e054; color: #c8e054; }
    .hint {
      font-family: 'Space Mono', monospace; font-size: 8px;
      letter-spacing: 0.1em; color: rgba(255,255,255,0.12);
    }
    .loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000000;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 16px; z-index: 100;
      transition: opacity 0.8s;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading-text {
      font-family: 'Space Mono', monospace; font-size: 10px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    .loading-text em { color: #c8e054; font-style: normal; }
    .loading-bar-wrap { width: 200px; height: 0.5px; background: rgba(255,255,255,0.1); }
    .loading-bar { height: 100%; width: 0%; background: #c8e054; transition: width 0.3s; }
  </style>
</head>
<body>

<div class="loading" id="loading">
  <p class="loading-text">geometry <em>of</em> societies</p>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  <p class="loading-text" id="loading-status">loading city...</p>
</div>

<div id="canvas-container"><canvas id="cv"></canvas></div>

<div class="ui-band">
  <div class="wordmark">geometry <em>of</em> societies</div>
  <nav class="nav">
    <a href="index.html" class="active">experiments</a>
    <a href="#">about</a>
    <a href="#">methods</a>
    <a href="#">writing</a>
  </nav>
</div>

<div class="ui-bottom">
  <div class="bottom-left">
    <span class="exp-label">// experimental social laboratory</span>
    <span class="exp-label">agents: <em id="stat-agents">0</em> &nbsp;|&nbsp; paths: <em>20</em></span>
  </div>
  <button class="enter-btn" onclick="window.location='index.html'">enter laboratory →</button>
  <span class="hint">drag · scroll</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){

  var cv = document.getElementById('cv');
  var W = window.innerWidth, H = window.innerHeight;
  cv.width = W; cv.height = H;

  var renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true});
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 1);
  renderer.shadowMap.enabled = true;

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.00005);

  var cam = new THREE.PerspectiveCamera(22, W/H, 0.1, 5000);
  cam.position.set(800, 500, 800);
  cam.lookAt(0, -maxDim * 0.15, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  var dl = new THREE.DirectionalLight(0xffffff, 1.0);
  dl.position.set(400, 800, 300);
  dl.castShadow = true;
  scene.add(dl);
  var dl2 = new THREE.DirectionalLight(0xc8e054, 0.08);
  dl2.position.set(-300, 200, -300);
  scene.add(dl2);

  var sph = {th: Math.PI * 1.75, ph: 0.22, r: 1200};
  var tSph = {th: sph.th, ph: sph.ph, r: sph.r};

  function setProgress(pct, msg) {
    document.getElementById('loading-bar').style.width = pct + '%';
    if(msg) document.getElementById('loading-status').textContent = msg;
  }

  function hideLoading() {
    var el = document.getElementById('loading');
    el.classList.add('hidden');
    setTimeout(function(){ el.style.display = 'none'; }, 900);
  }

  var pathData = {};
  var cityCenter = new THREE.Vector3();
  var citySize = new THREE.Vector3();
  var maxDim = 1000;

  setProgress(5, 'loading city...');

  var loader = new THREE.GLTFLoader();
  loader.load(
    'cityMeshSmall.glb',
    function(gltf) {
      setProgress(70, 'placing city...');

      var cityMat = new THREE.MeshLambertMaterial({color: 0xd8d8d8});
      gltf.scene.traverse(function(child) {
        if(child.isMesh) {
          child.material = cityMat;
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      var box = new THREE.Box3().setFromObject(gltf.scene);
      var center = box.getCenter(new THREE.Vector3());
      var size = box.getSize(new THREE.Vector3());
      cityCenter.copy(center);
      citySize.copy(size);

      gltf.scene.position.sub(center);
      scene.add(gltf.scene);

      maxDim = Math.max(size.x, size.y, size.z);
      tSph.r = maxDim * 0.9;
      sph.r = tSph.r;
      cam.position.set(tSph.r * 0.7, tSph.r * 0.5, tSph.r * 0.7);
      cam.lookAt(0, -maxDim * 0.15, 0);

      setProgress(85, 'loading paths...');
      loadPaths(center, size);
    },
    function(xhr) {
      if(xhr.total > 0) {
        var pct = Math.round((xhr.loaded / xhr.total) * 60) + 5;
        setProgress(pct, 'loading city... ' + Math.round(xhr.loaded/1024/1024) + 'MB');
      }
    },
    function(err) {
      console.error('GLB error:', err);
      setProgress(100, 'error loading model');
    }
  );

  function loadPaths(center, size) {
    fetch('paths.csv')
      .then(function(r){ return r.text(); })
      .then(function(text) {
        var lines = text.trim().split('\n').slice(1);
        lines.forEach(function(line) {
          var parts = line.split(',');
          var pid = parseInt(parts[0]);
          var idx = parseInt(parts[1]);
          var x = parseFloat(parts[2]) - center.x;
          var y = parseFloat(parts[3]) - center.y;
          var z = parseFloat(parts[4]) - center.z;
          if(!pathData[pid]) pathData[pid] = [];
          pathData[pid][idx] = new THREE.Vector3(x, y, z);
        });
        setProgress(95, 'spawning agents...');
        spawnAgents();
        setProgress(100, 'ready');
        setTimeout(hideLoading, 600);
      })
      .catch(function(err) {
        console.error('Paths error:', err);
        setTimeout(hideLoading, 600);
      });
  }

  var agents = [];
  var agentGeo = new THREE.CylinderGeometry(1.5, 1.5, 6, 8);
  var agentMat = new THREE.MeshLambertMaterial({color: 0x111111});

  function spawnAgents() {
    var count = 0;
    Object.keys(pathData).forEach(function(pid) {
      var pts = pathData[pid].filter(Boolean);
      if(pts.length < 2) return;
      var n = pts.length > 44 ? 2 : 1;
      for(var i = 0; i < n; i++) {
        var mesh = new THREE.Mesh(agentGeo, agentMat);
        mesh.castShadow = true;
        scene.add(mesh);
        var startIdx = Math.floor((i / n) * pts.length);
        agents.push({
          mesh: mesh,
          path: pts,
          idx: startIdx,
          progress: Math.random(),
          speed: 0.004 + Math.random() * 0.004
        });
        count++;
      }
    });
    document.getElementById('stat-agents').textContent = count;
  }

  var dragging = false;
  var pm = {x:0, y:0};

  document.addEventListener('mousedown', function(e){ dragging=true; pm={x:e.clientX,y:e.clientY}; });
  window.addEventListener('mouseup', function(){ dragging=false; });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    tSph.th = Math.max(Math.PI * 1.42, Math.min(Math.PI * 2.08, tSph.th - (e.clientX-pm.x)*0.006));
    tSph.ph = Math.max(0.12, Math.min(0.35, tSph.ph+(e.clientY-pm.y)*0.006));
    pm = {x:e.clientX, y:e.clientY};
  });
  document.addEventListener('wheel', function(e){
    tSph.r = Math.max(maxDim * 0.35, Math.min(maxDim * 0.9, tSph.r+e.deltaY*0.5));
    e.preventDefault();
  }, {passive:false});

  function loop() {
    requestAnimationFrame(loop);

    sph.th += (tSph.th-sph.th)*0.07;
    sph.ph += (tSph.ph-sph.ph)*0.07;
    sph.r  += (tSph.r -sph.r )*0.07;
    cam.position.set(
      sph.r*Math.sin(sph.ph)*Math.sin(sph.th),
      sph.r*Math.cos(sph.ph),
      sph.r*Math.sin(sph.ph)*Math.cos(sph.th)
    );
    cam.lookAt(0, -maxDim * 0.15, 0);

    agents.forEach(function(ag) {
      if(!ag.path || ag.path.length < 2) return;
      ag.progress += ag.speed;
      if(ag.progress >= 1) {
        ag.progress = 0;
        ag.idx = (ag.idx + 1) % ag.path.length;
      }
      var cur = ag.path[ag.idx];
      var nxt = ag.path[(ag.idx+1) % ag.path.length];
      if(!cur || !nxt) return;
      ag.mesh.position.lerpVectors(cur, nxt, ag.progress);
      ag.mesh.position.y += 3;
      var dir = nxt.clone().sub(cur);
      if(dir.length() > 0.01) {
        ag.mesh.rotation.y = Math.atan2(dir.x, dir.z);
      }
    });

    renderer.render(scene, cam);
  }
  loop();

})();
</script>
</body>
</html>
